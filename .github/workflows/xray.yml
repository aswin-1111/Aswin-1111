name: Developer X-Ray

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/xray.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Developer X-Ray card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/xray.py

      - name: Commit updated card if changed
        run: |
          if ! git diff --quiet -- assets/xray-card.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/xray-card.svg
            git commit -m "chore: refresh Developer X-Ray card"
            git push
          else
            echo "No changes to commit."
          fi
